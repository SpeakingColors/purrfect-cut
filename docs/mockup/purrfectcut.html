(function () { var sv = store(KIT.key + ".settings.v1"); if (sv && typeof sv === "object") { SET.bubbles = sv.bubbles !== false; SET.eco = !!sv.eco; } })();

function def(id, v) { DEF[id] = v; S[id] = v; }

/* ---------- info bubbles (after 1 s of hovering) ---------- */
var tipEl = $("#tip"), tipTimer = null;
function attachTip(el, label, text) {
  if (!text) return;
  el.addEventListener("pointerenter", function () {
    if (!SET.bubbles) return; clearTimeout(tipTimer);
    tipTimer = setTimeout(function () {
      tipEl.innerHTML = (label ? "<b>" + label + "</b>" : "") + text; tipEl.hidden = false;
      var r = el.getBoundingClientRect(); tipEl.style.left = Math.min(window.innerWidth - 270, Math.max(8, r.left)) + "px"; tipEl.style.top = Math.min(window.innerHeight - 90, r.bottom + 8) + "px";
    }, 1000);
  });

}
function hideTip() { clearTimeout(tipTimer); tipEl.hidden = true; }
$$("[data-tip]").forEach(function (el) { attachTip(el, (el.getAttribute("data-tl") || el.textContent.replace(/[▶‹›⋯▾■]/g, "").trim()), el.getAttribute("data-tip")); });

/* ---------- parameters and controls ---------- */
function setParam(id, v, fromUI) {
  if (S[id] === v && !fromUI) { if (UI[id]) UI[id](v); return; }
  S[id] = v; if (UI[id]) UI[id](v); if (window.onParam) window.onParam(id, v, fromUI);
