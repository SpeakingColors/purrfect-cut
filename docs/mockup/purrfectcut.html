<script>
var KIT = {key:"purrfectcut", W:1340, H:1080};
/* Studio 87 mockup kit: helpers, info bubbles, knobs, selects, toggles, resizable window, modals, presets, frame loop.

var $ = function (s, r) { return (r || document).querySelector(s); };

/* ---------- info bubbles (after 1 s of hovering) ---------- */

}

$$("[data-tip]").forEach(function (el) { attachTip(el, (el.getAttribute("data-tl") || el.textContent.replace(/[▶‹›⋯▾■]/g, "").trim()), el.getAttribute("data-tip")); });

/* ---------- parameters and controls ---------- */

/* ---------- canvas helper: sharp at any window scale ---------- */
function fit(cv) {

  var g = cv.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0); return { g: g, w: w, h: h };
}

/* ---------- plugin window: fixed shape, resizable from all 4 corners and all 4 sides ---------- */
var BASE_W = KIT.W, BASE_H = KIT.H, ASPECT = BASE_W / BASE_H, MIN_S = 0.25, MAX_S = 2.5, winScale = 1, winX = 8, winY = 4;
var desk = $("#desk"), frameEl = $("#frame"), winEl = $("#win");
function deskW() { return desk.clientWidth || document.documentElement.clientWidth || 1000; }
function maxScaleNow() { return clamp((deskW() - 16) / BASE_W, MIN_S, MAX_S); }

  var w = BASE_W * winScale, h = BASE_H * winScale;
  frameEl.style.width = w + "px"; frameEl.style.height = h + "px"; frameEl.style.left = winX + "px"; frameEl.style.top = winY + "px";
  winEl.style.transform = "scale(" + winScale + ")"; desk.style.height = Math.ceil(winY + h + 12) + "px";

}

function setWinScale(s, save) {

  layoutWin(); if (save !== false) store(KIT.key + ".win.v1", { s: Math.round(winScale * 1000) / 1000 });
}
function initWin() {
  var sv = store(KIT.key + ".win.v1"); winScale = clamp(sv && typeof sv.s === "number" && isFinite(sv.s) ? sv.s : Math.min(1, maxScaleNow()), MIN_S, maxScaleNow()); centreWin(); layoutWin();

    var kind = hd.getAttribute("data-h"), sx = /e/.test(kind) ? 1 : /w/.test(kind) ? -1 : 0, sy = /s/.test(kind) ? 1 : /n/.test(kind) ? -1 : 0, st = null;
    hd.addEventListener("pointerdown", function (e) { st = { x0: winX, y0: winY, w0: BASE_W * winScale, h0: BASE_H * winScale, px: e.clientX, py: e.clientY }; hd.setPointerCapture(e.pointerId); hd.classList.add("drag"); hideTip(); e.preventDefault(); });

      var dW = deskW(), maxW = Math.min(dW - 16, BASE_W * MAX_S);
      if (sx === 1) maxW = Math.min(maxW, dW - 8 - st.x0); else if (sx === -1) maxW = Math.min(maxW, st.x0 + st.w0 - 8); else { var cx = st.x0 + st.w0 / 2; maxW = Math.min(maxW, 2 * Math.min(cx - 8, dW - 8 - cx)); }

    });

    hd.addEventListener("pointerup", end); hd.addEventListener("pointercancel", end);

}

/* ---------- modal cards ---------- */
var modal = $("#modal"), card = $("#card");

}

/* ---------- presets: factory list + your own (kept on this device) ---------- */
var PRE = { list: [], idx: 0, keys: [], apply: null, user: [] };
function initPresets(factory, keys, apply) {
