name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-g1" 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Core tests (editing model, sampler engine, FX, zoom; no JUCE)
        run: |
          cmake --build build --config Release --target test_core test_more test_pitch test_track test_poly test_spectral test_notes test_session 2>&1 | tee -a ci.log; [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Build (desktop app and VST3 sampler)
        run: cmake --build build --config Release --parallel 4 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: pluginval level 5 (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e +o pipefail
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip && unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process "build/PurrfectCutSampler_artefacts/Release/VST3/Purrfect Cut Sampler.vst3" 2>&1 | tee -a ci.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            sudo apt-get install -y gdb > /dev/null
            echo "=== backtrace of the crash ===" | tee -a ci.log
            xvfb-run -a gdb -batch -ex run -ex bt -ex "thread apply all bt 12" --args ./pluginval --strictness-level 5 --validate-in-process "build/PurrfectCutSampler_artefacts/Release/VST3/Purrfect Cut Sampler.vst3" 2>&1 | tail -80 | tee -a ci.log
          fi
          exit $rc
      - name: pluginval level 5 (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip && 7z x -y pv.zip > /dev/null
          ./pluginval.exe --strictness-level 5 --validate-in-process "build/PurrfectCutSampler_artefacts/Release/VST3/Purrfect Cut Sampler.vst3" 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: PurrfectCut-${{ runner.os }}
          path: build/*_artefacts/
          if-no-files-found: warn
      - name: Publish log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/logpub && cp ci.log /tmp/logpub/${{ runner.os }}.log || true
          tail -n 400 /tmp/logpub/${{ runner.os }}.log > /tmp/logpub/${{ runner.os }}.tail.log || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-log || true
          git checkout -B ci-log $(git rev-parse --verify -q origin/ci-log || echo HEAD)
          [ -n "$(git rev-parse --verify -q origin/ci-log)" ] || git rm -rf -q . || true
          mkdir -p logs && cp /tmp/logpub/*.tail.log logs/ && git add logs
          git commit -q -m "ci log ${{ runner.os }} $GITHUB_SHA" || true
          git push origin ci-log || true
